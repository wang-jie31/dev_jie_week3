      DEMO['site-config'] = Object.assign({}, DEMO['site-config'], b);
      return resp(0, DEMO['site-config'], '站点配置已保存');
    }

    // ---- 上传（演示占位图） ----
    if (r.path === '/api/v1/admin/upload' && m === 'POST')
      return resp(0, ['https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=800&q=80'], '上传成功（演示占位图）');

    return resp(404, null, '演示版未覆盖接口: ' + r.path);
  }
  window.fetch = function(url, opt){ return handle(parseReq(url, opt)); };

  // 演示徽标
  window.addEventListener('DOMContentLoaded', function(){
    var badge = document.createElement('div');
    badge.style.cssText = 'position:fixed;left:14px;bottom:14px;z-index:9999;background:#C73E3A;color:#fff;font-size:12px;line-height:1;padding:8px 12px;border-radius:9999px;box-shadow:0 6px 18px -6px rgba(0,0,0,.35);opacity:.94';

})();

  <script>
  /* ====================== 基础工具 ====================== */
  const API = '';
  let TOKEN = localStorage.getItem('qiyu_token') || '';
  let ROLE = localStorage.getItem('qiyu_role') || '';
  let NAME = localStorage.getItem('qiyu_name') || '';
  const ROLE_LABELS = { admin: '管理员', sales: '销售', design: '设计', cs: '客服' };
  const PAGE_ROLES = {
    overview: ['admin', 'sales', 'design', 'cs'], cases: ['admin', 'sales', 'design'],
    packages: ['admin', 'sales', 'design'], news: ['admin', 'design'],

    projects: ['admin', 'sales', 'design', 'cs'], team: ['admin', 'sales', 'design', 'cs'], sites: ['admin', 'sales', 'design', 'cs'],
    site: ['admin'], accounts: ['admin'], departments: ['admin'], 'login-logs': ['admin']
  };
  const WRITE_ROLES = {
    cases: ['admin', 'design'], packages: ['admin', 'design'],
    news: ['admin', 'design'], careers: ['admin', 'design'],
    messages: ['admin', 'sales', 'cs'], site: ['admin'], accounts: ['admin'], departments: ['admin'], 'login-logs': ['admin'],
    projects: ['admin', 'sales', 'design'], team: ['admin', 'design'], sites: ['admin', 'sales', 'design']

  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  function api(method, path, body, isForm){
    const opt = { method, headers: {} };
    if (TOKEN) opt.headers['Authorization'] = 'Bearer ' + TOKEN;
    if (body !== undefined) {
      if (isForm) { opt.body = body; }
      else { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    }
    return fetch(API + path, opt).then(r => r.json().then(d => ({ ok:r.ok, status:r.status, d })));
  }
  function toast(msg, type){
    const c = type==='err' ? '#C0392B' : '#3C8C4E';
    const el = document.createElement('div');
    el.className = 'toast text-white text-sm px-4 py-2.5 rounded-xl shadow';
    el.style.background = c; el.textContent = msg;
    $('#toast').appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);

    return '<span class="badge '+cls+'">'+t+'</span>';
  }

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await api('POST','/api/v1/admin/login', { username:$('#username').value, password:$('#password').value });
    if (r.ok && r.d.code===0) {
      TOKEN = r.d.data.token; localStorage.setItem('qiyu_token', TOKEN);
      ROLE = r.d.data.role; NAME = r.d.data.name || r.d.data.username;
      localStorage.setItem('qiyu_role', ROLE); localStorage.setItem('qiyu_name', NAME);
      enterApp();
    } else { $('#loginErr').textContent = (r.d && r.d.message) || '登录失败'; $('#loginErr').classList.remove('hidden'); }
  });
  $('#logoutBtn').addEventListener('click', () => {
    openModal('退出登录', '<p class="text-sm text-[#9A8C75]">确定要退出当前内部账号吗？退出后需重新登录才能管理内容。</p>', () => {
      TOKEN=''; ROLE=''; NAME='';
      localStorage.removeItem('qiyu_token'); localStorage.removeItem('qiyu_role'); localStorage.removeItem('qiyu_name');
      $('#appView').classList.add('hidden');
      $('#loginView').classList.remove('hidden');
      $('#password').value='';
      $('#username').focus();
      return true;
    });
  });
  $$('#sideNav .nav-item').forEach(a => a.addEventListener('click', () => {
    if (a.dataset.kind) currentMsgKind = a.dataset.kind;
    navigate(a.dataset.page);
  }));
  /* 侧边栏分组折叠：点击二级标题收回/展开其下子项，状态存 localStorage */
  function applyNavCollapse(){
    let collapsed = [];
    try { collapsed = JSON.parse(localStorage.getItem('qiyu_nav_collapsed') || '[]'); } catch(e){}
    $$('#sideNav [data-nav-toggle]').forEach(lbl => {
      const g = lbl.dataset.navToggle;
      const on = collapsed.indexOf(g) >= 0;
      lbl.classList.toggle('collapsed', on);
      $$('#sideNav [data-group="'+g+'"]').forEach(a => a.classList.toggle('nav-collapsed', on));
    });
  }
  $$('#sideNav [data-nav-toggle]').forEach(lbl => lbl.addEventListener('click', () => {
    let collapsed = [];
    try { collapsed = JSON.parse(localStorage.getItem('qiyu_nav_collapsed') || '[]'); } catch(e){}
    const g = lbl.dataset.navToggle;
    const i = collapsed.indexOf(g);
    if (i >= 0) collapsed.splice(i, 1); else collapsed.push(g);
    try { localStorage.setItem('qiyu_nav_collapsed', JSON.stringify(collapsed)); } catch(e){}
    applyNavCollapse();
  }));
  applyNavCollapse();
  // 当前留言模块类型（留言处理 / 预约处理）
  let currentMsgKind = 'appointment';
  // 概览卡片点击 → 跳转到对应管理页（带筛选条件）
  function gotoPage(key){
    const [page, arg] = key.split(':');
    if (page==='cases') caseFilters = { category:'all', status:arg||'all', q:'', page:1, sort:'new' };
    else if (page==='packages') pkgFilters = { type:'all', status:arg||'all', q:'', page:1 };
    else if (page==='news') newsFilters = { tag:'all', status:arg||'all', q:'', page:1 };
    else if (page==='careers') careerFilters = { category:'all', status:arg||'all', q:'', page:1 };
    else if (page==='messages'){
      if (arg==='message' || arg==='appointment'){ currentMsgKind = arg; msgFilters = { status:'all', source:'all', q:'', page:1 }; }
      else { currentMsgKind = 'appointment'; msgFilters = { status:arg||'all', source:'all', q:'', page:1 }; }
    }
    navigate(page);
  }

  function applyRoleNav(){
    const visibleByGroup = {};
    $$('#sideNav .nav-item[data-page]').forEach(a => {
      const show = (PAGE_ROLES[a.dataset.page] || []).includes(ROLE);
      a.style.display = show ? '' : 'none';
      const g = a.dataset.group; if (g) visibleByGroup[g] = visibleByGroup[g] || show;
    });
    ['content','customer','biz','hr'].forEach(g => {
      const lbl = $('#sideNav [data-group-label="'+g+'"]');

  function renderWho(){

    if (!(PAGE_ROLES[page] || []).includes(ROLE)) { toast('当前角色无权限访问该模块', 'err'); page = 'overview'; }

    </div>`;
  }
  function kpiCard(title, total, thisMonth, lastMonth, delta, goto){
    return `<div class="card p-5 ${goto?'cursor-pointer hover:-translate-y-0.5 hover:shadow-md transition':''}" ${goto?`onclick="gotoPage('${goto}')"`:''}>

        <p class="text-sm text-[#9A8C75]">${title}</p>
        ${deltaBadge(delta)}

      <p class="text-xs text-[#9A8C75] mt-1">本月新增 ${thisMonth} · 上月 ${lastMonth}</p>

      ${goto?`<p class="text-xs text-[#2F6DB5] mt-3">点击查看明细 →</p>`:''}
    </div>`;
  }

    const r = await api('GET','/api/v1/admin/overview');
    if (!r.ok) return;
    const d = r.d.data;
    $('#pageContainer').innerHTML = `
      <p class="text-sm text-[#9A8C75] mb-4">📊 数据概览仪表盘 · 环比基于记录创建时间（本月 vs 上月）。点击卡片可跳转对应管理模块。</p>

        ${miniCard('进行中项目', d.projectActive, 'badge-amber', 'projects')}

  /* ====================== 数据可视化（自包含 SVG，无外部依赖） ====================== */
  const PROJECT_STATUS = {
    lead:        { label: '线索/预约', color: '#9A8C75' },
    measuring:   { label: '量房中',   color: '#2F6DB5' },
    designing:   { label: '方案设计', color: '#7E57C2' },
    quoting:     { label: '报价中',   color: '#E0A458' },
    signed:      { label: '已签约',   color: '#3C8C4E' },
    constructing:{ label: '施工中',   color: '#C0732B' },
    acceptance:  { label: '验收中',   color: '#2F8F9D' },
    done:        { label: '已结案',   color: '#4A3F30' },
    cancelled:   { label: '已流失',   color: '#C0392B' }
  };
  function svgDonut(statusObj){
    const segs = Object.keys(PROJECT_STATUS).map(k => ({ key:k, label:PROJECT_STATUS[k].label, color:PROJECT_STATUS[k].color, value: (statusObj && statusObj[k]) || 0 })).filter(s => s.value > 0);
    const total = segs.reduce((a, s) => a + s.value, 0);
    if (!total) return '<p class="text-sm text-[#9A8C75]">暂无项目数据</p>';
    const C = 2 * Math.PI * 46;
    let acc = 0;
    const arcs = segs.map(s => {
      const dash = s.value / total * C;
      const arc = `<circle cx="60" cy="60" r="46" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
      acc += dash;
      return arc;
    }).join('');
    const legend = segs.map(s => `<div class="flex items-center gap-2 text-xs"><span class="w-2.5 h-2.5 rounded-full" style="background:${s.color}"></span><span class="text-[#9A8C75]">${s.label}</span><span class="ml-auto font-medium tabular-nums">${s.value}</span></div>`).join('');
    return `<div class="flex items-center gap-5">
      <svg viewBox="0 0 120 120" width="120" height="120" class="shrink-0">
        ${arcs}
        <text x="60" y="56" font-size="20" font-weight="bold" text-anchor="middle" fill="#4A3F30">${total}</text>
        <text x="60" y="72" font-size="9" text-anchor="middle" fill="#9A8C75">项目总数</text>
      </svg>
      <div class="flex-1 grid grid-cols-1 gap-1.5">${legend}</div>
    </div>`;
  }
  function svgBars(trend){
    if (!trend || !trend.length) return '<p class="text-sm text-[#9A8C75]">暂无数据</p>';
    const max = Math.max(1, ...trend.map(t => Math.max(t.projects, t.appointments)));
    const W = 380, H = 170, base = 130, bw = 13, gap = 4, step = 60;
    const bars = trend.map((t, i) => {
      const x = 14 + i * step;
      const hp = Math.round(t.projects / max * 100);
      const ha = Math.round(t.appointments / max * 100);
      return `<rect x="${x}" y="${base-hp}" width="${bw}" height="${hp}" rx="2" fill="#3C8C4E"/>
        <rect x="${x+bw+gap}" y="${base-ha}" width="${bw}" height="${ha}" rx="2" fill="#2F6DB5"/>
        <text x="${x+bw}" y="${base+14}" font-size="9" fill="#9A8C75" text-anchor="middle">${t.month.slice(2)}</text>`;
    }).join('');
    return `<div class="flex items-center gap-4">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">
        <line x1="10" y1="${base}" x2="${W-10}" y2="${base}" stroke="#ECE3D2"/>
        ${bars}
      </svg>
      <div class="text-xs space-y-1 shrink-0">
        <div><span class="inline-block w-3 h-3 rounded-sm mr-1 align-middle" style="background:#3C8C4E"></span>新增项目</div>
        <div><span class="inline-block w-3 h-3 rounded-sm mr-1 align-middle" style="background:#2F6DB5"></span>新增预约</div>
      </div>
    </div>`;
  }
  function svgHBars(list){
    if (!list || !list.length) return '<p class="text-sm text-[#9A8C75]">暂无数据</p>';
    const max = Math.max(1, ...list.map(x => x.count));
    return `<div class="space-y-2">${list.map(x => {
      const w = Math.round(x.count / max * 100);
      return `<div class="flex items-center gap-3 text-sm">
        <span class="w-24 truncate text-[#9A8C75]">${esc(x.name)}</span>
        <div class="flex-1 h-4 rounded-full bg-[#EFEAE0] overflow-hidden"><div class="h-full bg-[#4A3F30]" style="width:${w}%"></div></div>
        <span class="w-6 text-right tabular-nums">${x.count}</span>
      </div>`;
    }).join('')}</div>`;
  }

  function openModal(title, bodyHtml, onSave){
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-mask fixed inset-0 z-40 flex items-start justify-center p-4 overflow-y-auto" style="background:rgba(74,63,48,.45);">
      <div class="card w-full max-w-2xl my-10 p-6">
        <div class="flex items-center justify-between mb-4"><h3 class="font-serif text-xl font-bold">${title}</h3><button id="mClose" class="text-2xl text-[#9A8C75] cursor-pointer">×</button></div>
        <div id="mBody" class="max-h-[60vh] overflow-y-auto pr-1">${bodyHtml}</div>
        <div class="flex justify-end gap-3 mt-5">
          <button id="mCancel" class="px-4 py-2 rounded-xl border border-[#ECE3D2] text-sm cursor-pointer">取消</button>
          <button id="mSave" class="btn-yolk px-5 py-2 rounded-xl text-sm font-medium cursor-pointer">保存</button>
        </div>
      </div></div>`;
    const close = () => root.innerHTML='';
    $('#mClose').onclick = close; $('#mCancel').onclick = close;
    root.querySelector('.modal-mask').onclick = (e)=>{ if(e.target===root.querySelector('.modal-mask')) close(); };
    $('#mSave').onclick = async () => { const ok = await onSave(); if(ok) close(); };
  }
  function pager(total, page, pageSize, stateVar){
    if (!total) return ''; // 空数据不显示分页条
    const pages = Math.max(1, Math.ceil(total/pageSize)||1); // 1 页也显示分页条（与设计稿一致）
    const prevDis = page <= 1, nextDis = page >= pages;
    const navBtn = (cls) => `px-4 py-2.5 rounded-xl border text-sm ${cls}`;
    const navDis = 'border-[#F0E7D6] text-[#C5B89E] cursor-not-allowed';
    const navOn  = 'border-[#ECE3D2] text-[#4A3F30] hover:bg-[#F9F3E6] cursor-pointer';
    const numOn  = 'border border-[#ECE3D2] text-[#4A3F30] hover:bg-[#F9F3E6] cursor-pointer';
    const numCur = 'btn-yolk text-[#4A3F30] font-medium';
    let btns = [];
    btns.push(`<button class="${navBtn(prevDis?navDis:navOn)}" ${prevDis?'disabled':''} data-pg="${page-1}">上一页</button>`);
    for(let i=1;i<=pages;i++) btns.push(`<button class="${navBtn(i===page?numCur:numOn)}" data-pg="${i}">${i}</button>`);
    btns.push(`<button class="${navBtn(nextDis?navDis:navOn)}" ${nextDis?'disabled':''} data-pg="${page+1}">下一页</button>`);
    return `<div class="flex flex-wrap justify-center items-center gap-2.5 mt-6" data-state="${stateVar}">${btns.join('')}<span class="text-xs text-[#9A8C75] ml-1 whitespace-nowrap">共 ${total} 条 · 第 ${page}/${pages} 页</span></div>`;
  }
  function bindPager(stateVar, render){
    $$('.flex.justify-center [data-pg]').forEach(b=>b.onclick=()=>{ const p=+b.dataset.pg; if(p<1) return; window[stateVar].page=p; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  }
  function opt(arr, cur){ return arr.map(([v,t])=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`).join(''); }
  function splitCSV(s, sep=','){ return (s||'').split(sep).map(x=>x.trim()).filter(Boolean); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function fmtTime(s){ try { return new Date(s).toLocaleString('zh-CN'); } catch(e){ return s; } }
  </script>
</body>
</html>
